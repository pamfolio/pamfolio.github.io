name: Publish Haifeng — owner confirmation
# No push trigger: saving CMS content NEVER starts a website deployment.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Optional Pages CMS action context'
        required: false
        default: '{}'
        type: string
permissions:
  contents: read
concurrency:
  group: haifeng-pages-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate and build content
        run: python3 scripts/build.py
      - name: Check JavaScript syntax
        run: find _site -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish approved version
        id: deployment
        uses: actions/deploy-pages@v4
