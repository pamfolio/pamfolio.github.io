name: Check content — no publishing
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/build.py
      - run: find _site -name '*.js' -print0 | xargs -0 -n1 node --check
